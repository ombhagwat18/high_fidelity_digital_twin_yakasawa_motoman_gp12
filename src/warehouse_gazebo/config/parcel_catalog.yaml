# parcel_catalog.yaml — single source of truth for spawned conveyor parcels.
#
# Every spawned parcel carries exactly one ArUco marker (DICT_4X4_50) on its
# top face. The marker ID is the ONLY thing perception needs to detect —
# shape, physical dimensions, and the destination bin are looked up from here
# by both product_spawner.py (what to spawn) and
# warehouse_perception/parcel_perception.py (what a detected ID means).
#
# NOTE: the marker IDs listed here MUST match the ID list generated by
# scripts/generate_parcel_marker_assets.py (see that script's MARKER_IDS).
# If you add/remove a catalog entry, regenerate the marker assets too.

aruco_dict: DICT_4X4_50

parcels:
  - marker_id: 0
    shape: box
    dims_m: [0.08, 0.08, 0.08]
    grasp_z_offset: 0.0
    bin: bin_a
    description: "small cube box"

  - marker_id: 1
    shape: box
    dims_m: [0.12, 0.10, 0.08]
    grasp_z_offset: 0.0
    bin: bin_a
    description: "large rectangular box"

  - marker_id: 2
    shape: cylinder
    dims_m: [0.09, 0.09, 0.09]     # [diameter, diameter, height]
    grasp_z_offset: 0.0
    bin: bin_b
    description: "small round parcel"

  - marker_id: 3
    shape: cylinder
    dims_m: [0.12, 0.12, 0.12]
    grasp_z_offset: 0.0
    bin: bin_b
    description: "large round parcel"

  - marker_id: 4
    shape: plate
    dims_m: [0.15, 0.10, 0.02]
    grasp_z_offset: -0.02   # thin part — descend further to reach the surface
    bin: bin_b
    description: "small flat plate/slab"

  - marker_id: 5
    shape: plate
    dims_m: [0.18, 0.14, 0.02]
    grasp_z_offset: -0.02
    bin: bin_b
    description: "large flat plate/slab"
