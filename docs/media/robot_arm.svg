<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#a9c6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" rx="18" fill="url(#bg)"/>

  <!-- floor / conveyor line -->
  <line x1="40" y1="300" x2="600" y2="300" stroke="#2C5364" stroke-width="2" opacity="0.6"/>
  <rect x="380" y="286" width="170" height="14" rx="4" fill="#16262e" stroke="#3a5a68" stroke-width="1.5"/>
  <rect x="392" y="270" width="26" height="16" rx="3" fill="#d64545"/>
  <rect x="428" y="272" width="20" height="20" rx="10" fill="#3aa0c9"/>
  <rect x="462" y="274" width="24" height="12" rx="3" fill="#e0b23a"/>

  <!-- ArUco marker on the tracked box -->
  <rect x="396" y="273" width="10" height="10" fill="#0F2027"/>

  <!-- robot base -->
  <rect x="150" y="270" width="90" height="30" rx="6" fill="url(#arm)"/>
  <rect x="170" y="230" width="50" height="46" rx="8" fill="url(#arm)"/>

  <!-- link 1 (S-axis riser) -->
  <rect x="182" y="150" width="26" height="86" rx="10" fill="url(#arm)"/>
  <circle cx="195" cy="230" r="16" fill="#16262e" stroke="url(#arm)" stroke-width="4"/>

  <!-- link 2 (upper arm, angled) -->
  <g transform="rotate(-18 195 150)">
    <rect x="182" y="70" width="26" height="86" rx="10" fill="url(#arm)"/>
  </g>
  <circle cx="205" cy="98" r="14" fill="#16262e" stroke="url(#arm)" stroke-width="4"/>

  <!-- link 3 (forearm, angled toward pick point) -->
  <g transform="rotate(32 205 98)">
    <rect x="192" y="20" width="24" height="90" rx="10" fill="url(#arm)"/>
  </g>
  <circle cx="292" cy="140" r="12" fill="#16262e" stroke="url(#arm)" stroke-width="4"/>

  <!-- wrist + vacuum gripper reaching toward the box -->
  <line x1="292" y1="140" x2="392" y2="230" stroke="url(#arm)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="392" cy="230" r="10" fill="#16262e" stroke="url(#arm)" stroke-width="3"/>
  <circle cx="404" cy="252" r="26" fill="url(#glow)"/>
  <circle cx="404" cy="252" r="9" fill="#ff6b3d"/>

  <!-- title -->
  <text x="320" y="40" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" fill="#e8f4f8" font-weight="600">
    GP12 &#8226; Vacuum Pick &#8226; ArUco Perception
  </text>
</svg>
